<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML CSS Task</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./iphone.js"></script>
</head>
<body>
  <iphone-frame>
      <main class="screen">
          <header class="header">
              <div id="back"><img src="items/back.svg"></div>
              <div id="user_name">user_name</div>
              <div id="options"><img src="items/options.svg"></div>
          </header>
          <div class="title">
              <aside id="subscribers">
                      <div id="posts">129<div id="label1">Posts</div></div>
                      <div id="followers">3680<div id="label1">Followers</div></div>
                      <div id="following">230<div id="label1">Following</div></div>
              </aside>
              <div id="avatar"><img id="avataricon" src="items/Avatar.svg">
              </div>
              <div class="nameblock">
                  <div id="name">Name</div>
                  <div id="account_type">Local business</div>
                  <link><div id="site">www.website.com</div>
              </div>
          </div>
          <div class="buttons">
              <div id="follow"><div id="button_label">Follow</div></div>
              <div id="message"><div id="button_label">Message</div></div>
              <div id="email"><div id="button_label">Email</div></div>
              <div id="arrow"><div id="button_label"><img src="items/arrow.svg"></div></div>
          </div>
          <div class="highlights">
              <div id="highlight"><img id="highlightsrc" src="items/highlights/highlight1.svg"><div id="label2">Highlight</div></div>
              <div id="highlight"><img id="highlightsrc" src="items/highlights/highlight2.svg"><div id="label2">Highlight</div></div>
              <div id="highlight"><img id="highlightsrc" src="items/highlights/highlight3.svg"><div id="label2">Highlight</div></div>
              <div id="highlight"><img id="highlightsrc" src="items/highlights/highlight4.svg"><div id="label2">Highlight</div></div>
          </div>
          <div class="separators">
              <div id="separator"><img id="separator-src" src="items/separator1.svg"> 
          </div>
          <div class="middlebar">
              <div id="photos"><img id="leftbutton" src="items/photos.svg"></div>
              <div id="tags"><img id="rightbutton" src="items/tags.svg"></div>
          </div>
          <div class="image_grid">
              <div class="grid-item"> <img src="items/feed/Img-01.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-02.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-03.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-04.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-05.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-06.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-07.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-08.png"></div>
              <div class="grid-item"> <img src="items/feed/Img-09.png"></div>
          </div>
          <footer class="footer">
              <div id="footer-icon"><img src="items/footer_icons/Home.svg"></div>
              <div id="footer-icon"><img src="items/footer_icons/Search.svg"></div>
              <div id="footer-icon"><img src="items/footer_icons/Add.svg"></div>
              <div id="footer-icon"><img src="items/footer_icons/Like.svg"></div>
              <div id="footer-icon"><img src="items/footer_icons/Frame.svg"></div>
          </footer>
      
  


</div>
</main>
</iphone-frame>
</body>
</html>
